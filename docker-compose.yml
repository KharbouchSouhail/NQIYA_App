services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nqiya
      POSTGRES_USER: nqiya
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nqiya}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nqiya -d nqiya"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://db:5432/nqiya
      DB_USERNAME: nqiya
      DB_PASSWORD: ${DB_PASSWORD:-nqiya}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ random characters)}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELS: ${GROQ_MODELS:-qwen/qwen3.8-27b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-NQIYA <no-reply@nqiya.ma>}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-false}
    # private: only reachable through the frontend's /api proxy

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
